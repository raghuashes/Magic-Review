services:
  postgres:
    image: postgres:16-alpine
    container_name: magicreview-postgres
    restart: always
    environment:
      POSTGRES_DB: magicreview
      POSTGRES_USER: magicuser
      POSTGRES_PASSWORD: magicpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U magicuser -d magicreview"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: magicreview-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/magicreview
      SPRING_DATASOURCE_USERNAME: magicuser
      SPRING_DATASOURCE_PASSWORD: magicpassword
      JWT_SECRET: c2VjdXJlUmFuZG9tS2V5Rm9yTWFnaWNSZXZpZXdCYWNrZW5kQXBwbGljYXRpb24yMDI2U2FhUw==
      JWT_EXPIRATION_MS: 86400000
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_FRONTEND_BASE_URL: http://localhost:5173
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: magicreview-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
