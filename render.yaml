services:
  # 1. Spring Boot Java 21 Backend Web Service
  - type: web
    name: magic-review-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: magicreview-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: magicreview-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: magicreview-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION_MS
        value: 86400000
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_FRONTEND_BASE_URL
        value: https://magic-review-ui.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://magic-review-ui.onrender.com,http://localhost:5173

  # 2. React 18 / Vite Frontend Static Site
  - type: web
    name: magic-review-ui
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    region: singapore
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: magic-review-api
          property: host

databases:
  # 3. Managed PostgreSQL 16 Database
  - name: magicreview-db
    plan: free
    region: singapore
    databaseName: magicreview
    user: magicuser
