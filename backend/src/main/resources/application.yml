server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: magic-review-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

# Magic Review App Configuration
app:
  jwt:
    secret: ${JWT_SECRET:c2VjdXJlUmFuZG9tS2V5Rm9yTWFnaWNSZXZpZXdCYWNrZW5kQXBwbGljYXRpb24yMDI2U2FhUw==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  frontend-base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# AI Integration Configuration
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}
  api-url: https://generativelanguage.googleapis.com/v1beta/models

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
